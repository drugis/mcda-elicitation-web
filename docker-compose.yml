services:
  # PostgreSQL database
  db:
    image: postgres:9.6
    container_name: mcda-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ./database.pg.sql:/docker-entrypoint-initdb.d/database.pg.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # Plumber R API (replaces patavi-server + patavi-worker + rabbitmq)
  plumber-api:
    build:
      context: .
      dockerfile: plumber-api/Dockerfile
    image: mcda-plumber-api:local
    container_name: mcda-plumber-api
    restart: unless-stopped
    environment:
      R_MAX_VSIZE: 16Gb
      PATAVI_API_KEY: ${PATAVI_API_KEY}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # MCDA elicitation web app
  mcda-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        AUTH: ${AUTH_MODE}
    image: mcda-web:local
    container_name: mcda-web
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
      - plumber-api
    environment:
      # Database configuration (MCDAWEB_DB_* prefix required by the app)
      MCDAWEB_DB_HOST: db
      MCDAWEB_DB_PORT: "5432"
      MCDAWEB_DB_USER: ${POSTGRES_USER}
      MCDAWEB_DB_PASSWORD: ${POSTGRES_PASSWORD}
      MCDAWEB_DB_NAME: ${POSTGRES_DB}
      
      # Plumber API configuration (replaces Patavi)
      PLUMBER_API_URL: http://plumber-api:8000
      PATAVI_API_KEY: ${PATAVI_API_KEY}
      USE_PLUMBER: "true"
      
      # Authentication configuration
      MCDAWEB_AUTHENTICATION_METHOD: ${AUTH_MODE}
      MCDAWEB_GOOGLE_KEY: ${MCDAWEB_GOOGLE_KEY}
      MCDAWEB_GOOGLE_SECRET: ${MCDAWEB_GOOGLE_SECRET}
      MCDAWEB_COOKIE_SECRET: ${MCDAWEB_COOKIE_SECRET}
      
      # Other configuration
      HOST: "0.0.0.0"
      PORT: "3002"
      MCDA_HOST: "0.0.0.0"
    # no plumber-dumps volume in production deployment
    ports:
      - "3000:3002"

volumes:
  pgdata:
