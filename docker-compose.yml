services:
  # PostgreSQL database
  db:
    image: postgres:9.6
    container_name: mcda-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ./database.pg.sql:/docker-entrypoint-initdb.d/database.pg.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # RabbitMQ broker
  rabbitmq:
    image: rabbitmq:3-management
    container_name: mcda-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # Management UI (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  # Patavi server (official public image)
  patavi-server:
    image: addis/patavi-server:latest
    container_name: patavi-server
    restart: unless-stopped
    depends_on:
      - rabbitmq
      - db
    environment:
      PATAVI_BROKER_HOST: rabbitmq
      PATAVI_PORT: 3000
      PATAVI_DB_HOST: db
      PATAVI_DB_PORT: 5432
      PATAVI_DB_NAME: patavi
      PATAVI_DB_USER: ${POSTGRES_USER}
      PATAVI_DB_PASSWORD: ${POSTGRES_PASSWORD}
      PATAVI_API_KEY: ${PATAVI_API_KEY}
      SECURE_TRAFFIC: "false"
      PATAVI_HOST: patavi-server
    volumes:
      - patavi-ssl:/var/lib/patavi/ssl
    ports:
      - "3001:3000" # host:container

  # Patavi R worker (SMAA backend)
  patavi-worker:
    build:
      context: ./R
      dockerfile: Dockerfile
    image: patavi-smaa-worker:local
    container_name: patavi-worker
    restart: unless-stopped
    depends_on:
      - patavi-server
      - rabbitmq
    environment:
      PATAVI_BROKER_HOST: rabbitmq
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      PATAVI_SERVER: http://patavi-server:3000
    volumes:
      - ./R:/app/R:ro # optional for development

  # MCDA elicitation web app
  mcda-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        AUTH: ${AUTH_MODE}
    image: mcda-web:local
    container_name: mcda-web
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
      - rabbitmq
      - patavi-server
    environment:
      # Database configuration (MCDAWEB_DB_* prefix required by the app)
      MCDAWEB_DB_HOST: db
      MCDAWEB_DB_PORT: "5432"
      MCDAWEB_DB_USER: ${POSTGRES_USER}
      MCDAWEB_DB_PASSWORD: ${POSTGRES_PASSWORD}
      MCDAWEB_DB_NAME: ${POSTGRES_DB}
      
      # Patavi configuration
      PATAVI_HOST: patavi-server
      PATAVI_PORT: "3000"
      PATAVI_API_KEY: ${PATAVI_API_KEY}
      SECURE_TRAFFIC: "true"
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      PATAVI_CA: "/var/lib/mcda/ca-crt.pem"
      PATAVI_CLIENT_KEY: "/var/lib/mcda/client-key.pem"
      PATAVI_CLIENT_CRT: "/var/lib/mcda/client-crt.pem"
      
      # Authentication configuration
      MCDAWEB_AUTHENTICATION_METHOD: ${AUTH_MODE}
      MCDAWEB_GOOGLE_KEY: ${MCDAWEB_GOOGLE_KEY}
      MCDAWEB_GOOGLE_SECRET: ${MCDAWEB_GOOGLE_SECRET}
      MCDAWEB_COOKIE_SECRET: ${MCDAWEB_COOKIE_SECRET}
      
      # Other configuration
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      HOST: "0.0.0.0"
      PORT: "3002"
      MCDA_HOST: "0.0.0.0"
    volumes:
      - ./ca-crt.pem:/var/lib/mcda/ca-crt.pem:ro
      - ./client-crt.pem:/var/lib/mcda/client-crt.pem:ro
      - ./client-key.pem:/var/lib/mcda/client-key.pem:ro
    ports:
      - "3000:3002"

volumes:
  pgdata:
  patavi-ssl:
